<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Store</title>
<style>
:root{--bg:#0b0d12;--card:#141821;--line:#232a38;--txt:#e8ecf4;--mut:#8a94a8;--acc:#7c5cff;--ok:#2ecc71;--bad:#ff6b6b}
*{box-sizing:border-box}
html{background:#0b0d12}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.4}
nav{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0b0d12ee;z-index:5}
.logo{font-weight:800;letter-spacing:1px}.logo span{color:var(--acc)}
#nav{display:flex;gap:4px}
.lk{background:none;color:var(--mut);padding:8px;font-size:14px;font-weight:500}
.hero{padding:40px 18px 20px;text-align:center;max-width:720px;margin:0 auto}
.tag{color:var(--acc);font-size:12px;letter-spacing:2px;font-weight:700}
.hero h1{font-size:34px;line-height:1.1;margin:10px 0}
.hero p{color:var(--mut);margin:0 0 20px}
button,.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
button.sec{background:#222a3a}
main{max-width:720px;margin:0 auto;padding:8px 16px 48px}
h2{font-size:22px;margin:24px 0 12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters button{background:var(--card);border:1px solid var(--line);color:var(--mut);padding:8px 14px;font-size:14px}
.filters button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#list{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px}
#list .card{margin:0}
.card small{color:var(--acc);font-weight:700;font-size:12px;letter-spacing:1px}
.card h3{margin:4px 0;font-size:18px}.card p{margin:0 0 12px;color:var(--mut);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{font-weight:700;font-size:18px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:24px}
#sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:9}
#sheet.on{display:flex}
.box{background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:520px;padding:20px;max-height:90vh;overflow:auto}
.box h2{margin:0 0 12px}
input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font-size:16px;margin:6px 0}
#qr{display:flex;justify-content:center;margin:10px 0}
#qr canvas,#qr img{background:#fff;padding:8px;border-radius:10px;max-width:220px}
textarea{width:100%;height:80px;background:var(--bg);color:var(--mut);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px}
.c{text-align:center}.mut{color:var(--mut);font-size:14px}.ok{color:var(--ok)}.bad{color:var(--bad);font-size:14px}
.x{background:none;color:var(--bad);padding:4px 8px;font-size:13px}
#toast{position:fixed;left:12px;right:12px;bottom:84px;background:var(--acc);color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;display:none;z-index:99;text-align:center}
</style>
</head>
<body>
<nav><div class="logo">BUILD<span>STORE</span></div><div id="nav"></div></nav>
<section class="hero">
  <div class="tag">MARKETPLACE DE BUILDS</div>
  <h1>Construa seu próximo grande jogo.</h1>
  <p>Mapas, cenários e estruturas para acelerar seus projetos no Roblox Studio. Pague no Pix e receba sua build.</p>
  <a class="btn" href="#vitrine">Explorar builds</a>
</section>
<main id="vitrine">
  <h2>Explore as builds</h2>
  <div class="filters" id="filters"></div>
  <div id="list"></div>
</main>
<footer>© Build Store · Arquivos digitais para Roblox Studio</footer>
<div id="sheet"><div class="box" id="box"></div></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ===== EDITE SÓ ESTA PARTE ===== */
const PIX_KEY  = '+5581982257047';   // telefone sempre com +55 e DDD
const PIX_NAME = 'ADRYEL LINS';
const PIX_CITY = 'SAO JOSE';

const PRODUCTS = [
  { id: 'castelo', cat: 'Estruturas', name: 'Castelo Medieval', price: 19.90, desc: 'Build completa, pronta para o Studio.' },
  { id: 'spawn',   cat: 'Mapas',      name: 'Spawn Moderno',    price: 9.90,  desc: 'Área inicial com decoração.' },
];
/* =============================== */

const $ = (s) => document.querySelector(s);
const brl = (n) => n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const LS = {
  get: (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let cat = 'Todos', user = LS.get('bs_session', null), pending = null, toastT;
const users = () => LS.get('bs_users', {});
const data = () => LS.get('bs_data_' + user, { cart: [], orders: [] });
const save = (d) => LS.set('bs_data_' + user, d);
const prod = (id) => PRODUCTS.find(p => p.id === id);
async function hash(t){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }

/* ---------- Pix copia e cola ---------- */
const f = (id, v) => id + String(v.length).padStart(2, '0') + v;
function crc(s){ let c = 0xFFFF; for (let i = 0; i < s.length; i++){ c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) : (c << 1); c &= 0xFFFF; } return c.toString(16).toUpperCase().padStart(4, '0'); }
function pixCode(amount){
  const p = f('00','01') + f('01','11') + f('26', f('00','br.gov.bcb.pix') + f('01', PIX_KEY)) +
    f('52','0000') + f('53','986') + f('54', amount.toFixed(2)) + f('58','BR') +
    f('59', PIX_NAME) + f('60', PIX_CITY) + f('62', f('05','***')) + '6304';
  return p + crc(p);
}

/* ---------- Interface ---------- */
function nav(){
  $('#nav').innerHTML = user
    ? `<button class="lk" onclick="cartView()">Carrinho (${data().cart.length})</button><button class="lk" onclick="ordersView()">Compras</button><button class="lk" onclick="logout()">Sair</button>`
    : `<button class="lk" onclick="authView('login')">Entrar</button>`;
}
function filters(){
  const cats = ['Todos', ...new Set(PRODUCTS.map(p => p.cat))];
  $('#filters').innerHTML = cats.map(c => `<button data-c="${c}" class="${c === cat ? 'on' : ''}">${c}</button>`).join('');
}
function show(){
  filters();
  $('#list').innerHTML = PRODUCTS.filter(p => cat === 'Todos' || p.cat === cat).map(p => `
    <div class="card"><small>${p.cat.toUpperCase()}</small><h3>${p.name}</h3><p>${p.desc}</p>
    <div class="row"><span class="price">${brl(p.price)}</span>
    <button onclick="add('${p.id}')">Adicionar ao carrinho</button></div></div>`).join('');
}
$('#filters').onclick = (e) => { if (e.target.dataset.c) { cat = e.target.dataset.c; show(); } };
function open_(html){ $('#box').innerHTML = html; $('#sheet').classList.add('on'); }
function close_(){ $('#sheet').classList.remove('on'); }
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') close_(); });
function toast(t){ const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => el.style.display = 'none', 8000); }

/* ---------- Conta ---------- */
function authView(mode){
  const reg = mode === 'reg';
  open_(`<h2>${reg ? 'Criar conta' : 'Entrar'}</h2>
    ${reg ? '<input id="an" placeholder="Seu nome" autocomplete="name">' : ''}
    <input id="ae" type="email" placeholder="E-mail" autocomplete="email">
    <input id="ap" type="password" placeholder="Senha (mínimo 6 caracteres)" autocomplete="${reg ? 'new-password' : 'current-password'}">
    <p class="bad" id="er"></p>
    <button style="width:100%" onclick="doAuth('${mode}')">${reg ? 'Cadastrar' : 'Entrar'}</button>
    <p class="mut c">${reg ? 'Já tem conta?' : 'Ainda não tem conta?'}
    <a href="#" style="color:var(--acc)" onclick="authView('${reg ? 'login' : 'reg'}');return false">${reg ? 'Entrar' : 'Cadastre-se'}</a></p>`);
}
async function doAuth(mode){
  const email = $('#ae').value.trim().toLowerCase(), pw = $('#ap').value, name = mode === 'reg' ? $('#an').value.trim() : 'x';
  const err = (t) => { $('#er').textContent = t; };
  if (!/^\S+@\S+\.\S+$/.test(email) || pw.length < 6 || !name) return err('Preencha tudo. A senha precisa ter 6 ou mais caracteres.');
  const u = users(), h = await hash(pw);
  if (mode === 'reg') {
    if (u[email]) return err('Este e-mail já está cadastrado.');
    u[email] = { name, h }; LS.set('bs_users', u);
  } else if (!u[email] || u[email].h !== h) return err('E-mail ou senha incorretos.');
  user = email; LS.set('bs_session', email); nav(); close_();
  if (pending) { const id = pending; pending = null; add(id); }
}
function logout(){ user = null; LS.set('bs_session', null); nav(); close_(); }

/* ---------- Carrinho ---------- */
function add(id){
  if (!user) { pending = id; return authView('login'); }
  const d = data(); if (!d.cart.includes(id)) d.cart.push(id);
  save(d); nav(); cartView();
}
function rm(id){ const d = data(); d.cart = d.cart.filter(x => x !== id); save(d); nav(); cartView(); }
function cartView(){
  const items = data().cart.map(prod).filter(Boolean);
  if (!items.length) return open_('<h2>Carrinho</h2><p class="mut c">Seu carrinho está vazio.</p><button class="sec" style="width:100%" onclick="close_()">Continuar comprando</button>');
  const total = items.reduce((a, p) => a + p.price, 0);
  open_(`<h2>Carrinho</h2>` + items.map(p => `<div class="card row"><div><b>${p.name}</b><div class="mut">${brl(p.price)}</div></div><button class="x" onclick="rm('${p.id}')">Remover</button></div>`).join('') +
    `<div class="row" style="margin:12px 0"><span>Total</span><span class="price">${brl(total)}</span></div>
     <button style="width:100%" onclick="checkout()">Pagar com Pix</button>`);
}
function checkout(){
  const d = data(), items = d.cart.map(prod).filter(Boolean);
  if (!items.length) return;
  const o = { id: 'P' + Date.now().toString(36).toUpperCase(), items: items.map(p => p.name), total: Math.round(items.reduce((a, p) => a + p.price, 0) * 100) / 100, status: 'Aguardando pagamento', date: new Date().toLocaleDateString('pt-BR') };
  d.orders.unshift(o); d.cart = []; save(d); nav(); showPay(o.id);
}

/* ---------- Pagamento ---------- */
function showPay(id){
  const o = data().orders.find(x => x.id === id); if (!o) return;
  const code = pixCode(o.total);
  open_(`<h2 class="c">Pedido ${o.id} · ${brl(o.total)}</h2>
    <p class="mut c">${o.items.join(' + ')}</p>
    <div id="qr"></div>
    <p class="mut c">Pague pelo QR Code ou copie o código Pix e cole no app do seu banco:</p>
    <textarea id="cd" readonly>${code}</textarea>
    <button class="sec" style="width:100%;margin:8px 0" onclick="navigator.clipboard.writeText($('#cd').value);this.textContent='Copiado ✓'">Copiar código Pix</button>
    <button style="width:100%" onclick="paid('${o.id}')">Já paguei: falar no chat</button>`);
  try { new QRCode($('#qr'), { text: code, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}
}
function paid(id){
  const d = data(), o = d.orders.find(x => x.id === id); if (!o) return;
  if (o.status.startsWith('Aguardando')) o.status = 'Comprovante enviado · em análise';
  save(d); openChat(id);
}

/* ---------- Compras e chat ---------- */
function ordersView(){
  const os = data().orders;
  open_('<h2>Minhas compras</h2>' + (os.length ? '<p class="mut">Toque em uma compra para abrir o chat dela.</p>' : '<p class="mut c">Você ainda não fez compras.</p>') +
    os.map(o => `<div class="card" style="cursor:pointer" onclick="openChat('${o.id}')">
      <div class="row"><b>Pedido ${o.id}</b><span class="price">${brl(o.total)}</span></div>
      <div class="mut">${o.date} · ${o.items.join(' + ')}</div>
      <div class="${o.status.startsWith('Aguardando') ? 'bad' : 'ok'}" style="font-size:14px;margin-top:6px">${o.status}</div>
      ${o.status.startsWith('Aguardando') ? `<button class="sec" style="margin-top:8px" onclick="event.stopPropagation();showPay('${o.id}')">Ver Pix</button>` : ''}
    </div>`).join(''));
}
function openChat(id){
  const o = data().orders.find(x => x.id === id); if (!o) return;
  close_();
  try {
    Tawk_API.setAttributes({ name: users()[user].name, email: user }, function(){});
    Tawk_API.showWidget();
    Tawk_API.addEvent('pedido', { pedido: o.id, itens: o.items.join(', '), total: brl(o.total), status: o.status }, function(){});
    Tawk_API.maximize();
  } catch (e) {}
  toast('Pedido ' + o.id + ': informe este número no chat.');
}

nav(); show();
</script>

</body>
</html>
